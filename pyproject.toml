[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adarcg-eeg"
version = "1.0.0"
description = "AdaRCG reproduction code for four EEG emotion-recognition datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.1",
]

[tool.setuptools.packages.find]
include = ["adarcg*"]

